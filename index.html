            <div class="point point3"></div>

            </div>
            <h3>Operation Nightfall</h3>
            <div class="progress-row">
                <progress value="65" max="100"></progress>
                <span class="Pcolor">65%</span>
            </div>
       </article>

       <article class="CardArticle2">
             <div class="topCard">
                <span class="badge  badget2">HIGH</span>

        <article class="CardArticle3">

            </div>

            <div class="progress-row">
                <progress value="15" max="100"></progress>
                <span class="Pcolor">15%</span>
            </div>
       </article>

        <article class="CardArticle4">
             <div class="topCard">
                <span class="badge badget4">HIGH</span>
                <span class="topS">Active</span>
            </div>
            <h3>Cyber Defense Grid</h3>
            <div class="progress-row">
                <progress value="80" max="100"></progress>
                <span class="Pcolor">80%</span>
            </div>

       <section class="alert">
